# XcodeGen spec. `make generate` in this directory writes Smokeshow.xcodeproj.
#
# The project is generated rather than committed for one reason: a .pbxproj is
# unreviewable, and this repo's whole premise is that four clients must not
# drift. A YAML target list is a thing a person can read in a pull request.
#
# Targets:
#   SmokeshowKit          shared framework — contract, design, widget views
#   SmokeshowKitWatch     the same sources built for watchOS (Apple requires it)
#   Smokeshow (iOS)       the app
#   Smokeshow (macOS)     the same SwiftUI sources, second platform
#   SmokeshowWidgets      WidgetKit extension, both platforms
#   SmokeshowWatch        watchOS app  ) scoped in this branch, see
#   SmokeshowWatchWidgets complications) docs/watch-and-live-activity.md
#
# Everything shares the `group.earth.smokeshow` App Group: one cached payload,
# one set of preferences, one entitlement snapshot.

name: Smokeshow
options:
  bundleIdPrefix: earth.smokeshow
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Recent XcodeGen defaults to the Xcode 16 pbxproj format (objectVersion 77),
  # which Xcode 15 refuses to open. Pin the older format so one generated
  # project works across both.
  objectVersion: 56

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    minVersion: "5.0.0"
    maxVersion: "6.0.0"

targets:

  # XcodeGen's multiplatform targets (`supportedDestinations`) cannot include
  # watchOS — Apple requires a separate target for it. So the shared framework
  # is built twice from one source tree: once for iOS+macOS, once for watchOS,
  # both with the module name SmokeshowKit so `import SmokeshowKit` is the same
  # line everywhere.
  SmokeshowKit:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/SmokeshowKit
    resources:
      - path: Sources/SmokeshowKit/Resources/Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.kit
        SKIP_INSTALL: YES

  SmokeshowKitWatch:
    type: framework
    platform: watchOS
    sources:
      - path: Sources/SmokeshowKit
    resources:
      - path: Sources/SmokeshowKit/Resources/Fixtures
    settings:
      base:
        # Same module name as the iOS/macOS build — the watch sources import
        # SmokeshowKit, not SmokeshowKitWatch.
        PRODUCT_NAME: SmokeshowKit
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.kit.watch
        SKIP_INSTALL: YES

  Smokeshow:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/SmokeshowApp
    dependencies:
      - target: SmokeshowKit
      - target: SmokeshowWidgets
        embed: true
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.app
        INFOPLIST_FILE: Configuration/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - SmokeshowKitTests
      gatherCoverageData: true
      # Local StoreKit testing: the intro offer, the price, and the renewal
      # cadence without App Store Connect.
      storeKitConfiguration: Configuration/Smokeshow.storekit

  SmokeshowWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/SmokeshowWidgets
    dependencies:
      - target: SmokeshowKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.app.widgets
        INFOPLIST_FILE: Configuration/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Widgets.entitlements

  SmokeshowWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/SmokeshowWatch
    dependencies:
      - target: SmokeshowKitWatch
      - target: SmokeshowWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.app.watchkitapp
        INFOPLIST_FILE: Configuration/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Watch.entitlements

  SmokeshowWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/SmokeshowWatchWidgets
    dependencies:
      - target: SmokeshowKitWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.app.watchkitapp.widgets
        INFOPLIST_FILE: Configuration/WatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Watch.entitlements

  SmokeshowKitTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/SmokeshowKitTests
    dependencies:
      - target: SmokeshowKit
