# XcodeGen spec. `make generate` in this directory writes Smokeshow.xcodeproj.
#
# The project is generated rather than committed for one reason: a .pbxproj is
# unreviewable, and this repo's whole premise is that four clients must not
# drift. A YAML target list is a thing a person can read in a pull request.
#
# Targets:
#   SmokeshowKit          shared framework — contract, design, widget views
#   SmokeshowKitWatch     the same sources built for watchOS (Apple requires it)
#   Smokeshow (iOS)       the app
#   Smokeshow (macOS)     the same SwiftUI sources, second platform
#   SmokeshowWidgets      WidgetKit extension, both platforms
#   SmokeshowWatch        watchOS app  ) scoped in this branch, see
#   SmokeshowWatchWidgets complications) docs/watch-and-live-activity.md
#
# Everything shares the `group.earth.smokeshow` App Group: one cached payload,
# one set of preferences, one entitlement snapshot.

name: Smokeshow
options:
  bundleIdPrefix: earth.smokeshow
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Recent XcodeGen defaults to the Xcode 16 pbxproj format (objectVersion 77),
  # which Xcode 15 refuses to open. Pin the older format so one generated
  # project works across both.
  objectVersion: 56

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    minVersion: "5.0.0"
    maxVersion: "6.0.0"
  # The map engine. MapKit could not render a dark basemap that agreed with the
  # frames — its own tiles ignore overrideUserInterfaceStyle here — so the dark
  # smoke ramp had no legible backdrop. MapLibre draws a basemap we control
  # (CARTO dark), on iOS and Android both, which is the only path to the dark
  # map and the shared engine Android needs. Binary is iOS-only; the dependency
  # below is filtered to iOS so the macOS app still links.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    minVersion: "6.28.0"
    maxVersion: "7.0.0"

targets:

  # XcodeGen's multiplatform targets (`supportedDestinations`) cannot include
  # watchOS — Apple requires a separate target for it. So the shared framework
  # is built twice from one source tree: once for iOS+macOS, once for watchOS,
  # both with the module name SmokeshowKit so `import SmokeshowKit` is the same
  # line everywhere.
  SmokeshowKit:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/SmokeshowKit
    resources:
      - path: Sources/SmokeshowKit/Resources/Fixtures
    dependencies:
      # RevenueCatEntitlementProvider lives in this target, so this target has
      # to link it — attaching the package to the app instead left the kit's
      # framework with undefined symbols. The watch build deliberately omits
      # it: the watch reads the cached entitlement snapshot and never talks to
      # the store, so `#if canImport(RevenueCat)` compiles that file out there.
      - package: RevenueCat
        product: RevenueCat
    # A framework is a bundle, and an embedded bundle without an Info.plist
    # fails the app's Validate phase at package time. CI never caught it
    # because `generic/platform=iOS Simulator` builds skip validation.
    info:
      path: Generated/Kit-Info.plist
      properties:
        CFBundleName: SmokeshowKit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        CURRENT_PROJECT_VERSION: "10"
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.kit
        SKIP_INSTALL: YES

  SmokeshowKitWatch:
    type: framework
    platform: watchOS
    sources:
      - path: Sources/SmokeshowKit
    resources:
      - path: Sources/SmokeshowKit/Resources/Fixtures
    info:
      path: Generated/KitWatch-Info.plist
      properties:
        CFBundleName: SmokeshowKit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        CURRENT_PROJECT_VERSION: "10"
        # Same module name as the iOS/macOS build — the watch sources import
        # SmokeshowKit, not SmokeshowKitWatch.
        PRODUCT_NAME: SmokeshowKit
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.kit.watch
        SKIP_INSTALL: YES

  Smokeshow:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/SmokeshowApp
    resources:
      # Apple's privacy manifest: declares collected data (location, device ID,
      # all for app functionality, none for tracking) and the required-reason
      # APIs the app links (UserDefaults, file timestamps). Read by the App
      # Store upload checker and feeds the App Privacy nutrition label.
      - path: Sources/SmokeshowApp/PrivacyInfo.xcprivacy
      # Onboarding illustration: a short, silent, looping clip of the map sweep.
      - path: Sources/SmokeshowApp/Resources
    dependencies:
      - target: SmokeshowKit
      - target: SmokeshowWidgets
        embed: true
      # iOS-only: the map is iOS-only, and MapLibre ships no macOS slice. The
      # macOS app builds without it and shows the same "map is iOS-only" state
      # it already did.
      - package: MapLibre
        product: MapLibre
        destinationFilters: [iOS]
    # Info.plists are generated rather than hand-written: a hand-rolled plist
    # missing the standard CFBundle* keys is what broke the AppIntents SSU
    # training phase ("Unable to parse Info.plist").
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Smokeshow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # One-shot, only when the user asks. The app never tracks a location.
        NSLocationWhenInUseUsageDescription: >-
          Smokeshow uses your location once to fetch the smoke forecast where
          you are. It is never stored on a server and never tied to an account.
        # Silent pushes from the notification backend say "the verdict moved",
        # which is what makes the widget refresh cheap.
        UIBackgroundModes: [remote-notification]
        # The smoke-event countdown in the Dynamic Island.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        CFBundleURLTypes:
          - CFBundleURLName: earth.smokeshow.deeplink
            CFBundleURLSchemes: [smokeshow]
        # RevenueCat's public SDK key. Publishable (it ships in every binary
        # and is extractable from any build), so it lives in REVENUECAT_API_KEY
        # in settings.base below rather than being injected. Empty resolves to
        # the stub entitlement provider, which is what keeps tests/CI running.
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        # May point at a separately deployed notification service. An empty
        # value falls back to https://smokeshow.earth for same-origin routing.
        NotificationServiceBaseURL: $(NOTIFICATION_SERVICE_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      base:
        REVENUECAT_API_KEY: appl_MFZkxeiJmmLRxVzceofABUPgWyS
        CURRENT_PROJECT_VERSION: "10"
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.app
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only. The screen is a portrait window/map; universal would drag
        # in iPad multitasking, which demands all orientations we do not design
        # for. (This is what the upload's 90474 rejection was, wrapped in a
        # -19241 "server error".)
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - SmokeshowKitTests
      gatherCoverageData: true
      # Local StoreKit testing: the intro offer, the price, and the renewal
      # cadence without App Store Connect.
      storeKitConfiguration: Configuration/Smokeshow.storekit

  SmokeshowWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/SmokeshowWidgets
    dependencies:
      - target: SmokeshowKit
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Smokeshow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CURRENT_PROJECT_VERSION: "10"
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.app.widgets
        CODE_SIGN_ENTITLEMENTS: Configuration/Widgets.entitlements

  SmokeshowWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/SmokeshowWatch
    dependencies:
      - target: SmokeshowKitWatch
      - target: SmokeshowWatchWidgets
        embed: true
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Smokeshow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: earth.smokeshow.app
    settings:
      base:
        CURRENT_PROJECT_VERSION: "10"
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.app.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Configuration/Watch.entitlements

  SmokeshowWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/SmokeshowWatchWidgets
    dependencies:
      - target: SmokeshowKitWatch
    info:
      path: Generated/WatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Smokeshow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CURRENT_PROJECT_VERSION: "10"
        PRODUCT_BUNDLE_IDENTIFIER: earth.smokeshow.app.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: Configuration/Watch.entitlements

  SmokeshowKitTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/SmokeshowKitTests
    dependencies:
      - target: SmokeshowKit
