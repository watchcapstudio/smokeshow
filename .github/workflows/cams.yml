name: cams-global-smoke

on:
  schedule:
    # CAMS global runs 00Z and 12Z and reaches the ADS ~6-8h later; 09:30 and
    # 21:30 UTC leaves a conservative margin (see latest_cycle()).
    - cron: "30 9,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with hrrr.yml: both jobs rewrite the `data` branch, so they queue
# rather than race. cancel-in-progress must stay false — cancelling here would
# mean one model's render killing the other's.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # ADS retrievals sit in a queue before they start streaming; the render
    # itself is a couple of minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: cams
          create-args: >-
            python=3.11
            xarray
            cfgrib
            eccodes
            numpy
            pillow
            cdsapi
          cache-environment: true
          init-shell: bash

      - name: Render CAMS global smoke frames
        shell: bash -leo pipefail {0}
        env:
          # ECMWF Atmosphere Data Store key. Free registration at
          # https://ads.atmosphere.copernicus.eu/ — repository secret only,
          # never bundled into the client.
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: python scripts/cams/render_frames.py

      - name: Publish to data branch
        shell: bash -leo pipefail {0}
        env:
          DOMAIN: cams
          # One regrid, two palettes: the light field the web map used to draw
          # and the dark-ramp copy it draws now (and the global dark coverage
          # HRRR-dark can't reach).
          DOMAINS: cams cams-dark
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/render/publish.sh
