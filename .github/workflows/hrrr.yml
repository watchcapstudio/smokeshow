name: hrrr-smoke

on:
  schedule:
    # ~2h40m after each 00/06/12/18Z HRRR cycle (f48 needs the 6-hourly runs)
    - cron: "40 2,8,14,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with cams-global: both jobs push to the `data` branch, and a
  # force-push race would drop one renderer's frames entirely.
  group: data-branch
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: hrrr
          create-args: >-
            python=3.11
            herbie-data
            xarray
            cfgrib
            eccodes
            numpy
            pyproj
            pillow
          cache-environment: true
          init-shell: bash

      - name: Render HRRR smoke frames
        shell: bash -leo pipefail {0}
        run: python scripts/hrrr/render_frames.py

      - name: Publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .github/workflows/publish-data.sh hrrr out/hrrr
