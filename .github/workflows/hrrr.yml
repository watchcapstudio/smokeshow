name: hrrr-smoke

on:
  schedule:
    # ~2h40m after each 00/06/12/18Z HRRR cycle (f48 needs the 6-hourly runs)
    - cron: "40 2,8,14,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with cams.yml: both jobs rewrite the `data` branch, so they queue
# rather than race. cancel-in-progress must stay false — cancelling here would
# mean one model's render killing the other's.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: hrrr
          create-args: >-
            python=3.11
            herbie-data
            xarray
            cfgrib
            eccodes
            numpy
            pyproj
            pillow
          cache-environment: true
          init-shell: bash

      - name: Render HRRR smoke frames
        shell: bash -leo pipefail {0}
        run: python scripts/hrrr/render_frames.py

      # NASA FIRMS active fire detections. Rides this job because FIRMS NRT
      # refreshes on roughly the same cadence as the HRRR cycles and this is
      # already the job that publishes to the `data` branch — no new
      # infrastructure, and the MAP_KEY never leaves Actions.
      #
      # continue-on-error: the fire layer is additive. If FIRMS is down or the
      # key is missing, out/fires.json is simply not written, the client draws
      # no icons, and the HRRR frames still publish.
      - name: Fetch FIRMS fire detections
        shell: bash -leo pipefail {0}
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/hrrr/fetch_fires.py

      - name: Publish to data branch
        shell: bash -leo pipefail {0}
        env:
          DOMAIN: hrrr
          # One regrid, two palettes: the light field the web map draws and the
          # dark-ramp copy the app draws on a black basemap.
          DOMAINS: hrrr hrrr-dark
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/render/publish.sh
