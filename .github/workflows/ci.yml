name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # Structure, not style. A both-sides merge resolution can split a rule in
      # half and leave it unclosed, which kills every rule after it — and
      # neither `npm test` nor `npm run build` notices. One did reach
      # production; see scripts/lint-css.mjs.
      - run: npm run lint:css
      - run: npm run build

  # Pixels, in a real browser. These are the only checks that measure what
  # actually paints — the fire-icon bug that reached production was invisible
  # to both `npm test` and `npm run build`, and verify:fires is what found it.
  #
  # verify:domains is deliberately NOT here. It reads the live `data` branch,
  # which the render jobs rewrite 4x/day, and its frames are absolute-valid-time
  # keyed — so an hours-old branch legitimately stops matching the current hour
  # and every city reports the coarse-grid fallback. That is correct behaviour
  # in the product and pure flake in CI. Run it by hand when changing domains.
  browser:
    name: browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # verify:fires builds its fixture with the real clusterer.
      - run: pip install --quiet numpy pillow

      - run: npm ci

      # puppeteer-core ships no browser. The runner image has Chrome; fail
      # loudly rather than let a missing binary read as a passing suite.
      - name: Locate Chrome
        run: |
          for p in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$p" ]; then echo "CHROME_PATH=$p" >> "$GITHUB_ENV"; echo "using $p"; exit 0; fi
          done
          echo "No Chrome on this runner; the browser checks cannot run." >&2
          exit 1

      - name: Start the dev server
        run: |
          npx vite --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "dev server never came up:" >&2; cat /tmp/vite.log >&2; exit 1

      - run: npm run verify:sky
      - run: npm run verify:map
      - run: npm run verify:fires

      # The captures are the point when one of these fails.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-captures
          path: scratch/*.png
          if-no-files-found: ignore

  # The parity guarantee, enforced.
  #
  # Two files in the Apple app are *generated* from sources the web owns:
  # Tokens.generated.swift from design/tokens.json, and the mock payloads from
  # src/lib/forecast.js. If either source changes and nobody re-runs the
  # generator, the apps and the web silently disagree — which is the exact
  # failure docs/smokeshow-platform-plan.md §2 exists to prevent.
  #
  # So: regenerate, then demand the working tree be unchanged.
  generated:
    name: generated artifacts are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Regenerate the web's design tokens
        run: npm run tokens

      - name: Regenerate the Apple design tokens
        run: npm run tokens:apple

      # Also re-validates every fixture against
      # design/forecast-api-v1.schema.json — the generator exits non-zero if a
      # payload stops matching the contract.
      - name: Regenerate the Apple contract fixtures
        run: npm run fixtures:apple

      - name: Fail if anything regenerated differently
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'npm run tokens && npm run tokens:apple && npm run fixtures:apple' and commit the result."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "Generated files match their sources."

  # SmokeshowKit compiles and its tests run without an Xcode project, so this
  # covers the contract decoder, the widget timeline budget, the trial/lapse
  # policy, and the parity guards (disclaimer verbatim, tokens from the JSON,
  # no verdict maths in Swift).
  apple-kit:
    name: SmokeshowKit tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: swift test
        working-directory: apple
        run: swift test

  # The app, the widget extension, and the watch targets need the generated
  # Xcode project. Code signing is off: this job proves the code compiles and
  # links, not that it can be shipped.
  apple-app:
    name: iOS + macOS build
    runs-on: macos-14
    # RevenueCat is compiled from source for three platforms on the first run;
    # the cache below makes later runs cheap, but the cold one is genuinely long.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Runner images carry several Xcodes; take the newest so the generated
      # project format is never ahead of the toolchain reading it.
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      # Compiling RevenueCat dominates this job. Key the cache on the spec and
      # the toolchain, so it survives everything except a dependency change.
      - name: Cache SwiftPM checkouts and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            apple/.spm
            ~/Library/Developer/Xcode/DerivedData
          key: apple-build-${{ runner.os }}-${{ hashFiles('apple/project.yml') }}
          restore-keys: |
            apple-build-${{ runner.os }}-

      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate --spec project.yml

      # Resolving RevenueCat is the one step that touches the network, and a
      # hang there looks identical to a slow compile. Bound it so it fails
      # loudly instead of eating the job's whole timeout.
      - name: Resolve package dependencies
        working-directory: apple
        # macOS has no GNU `timeout`; the step-level bound is the portable one.
        timeout-minutes: 15
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Smokeshow.xcodeproj \
            -clonedSourcePackagesDirPath .spm

      - name: Build for iOS Simulator
        working-directory: apple
        timeout-minutes: 40
        # -quiet drops the driver command echo and keeps the diagnostics, which
        # is the opposite of what I assumed when I removed it.
        run: |
          xcodebuild build -quiet \
            -project Smokeshow.xcodeproj \
            -scheme Smokeshow \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for macOS
        working-directory: apple
        run: |
          xcodebuild build -quiet \
            -project Smokeshow.xcodeproj \
            -scheme Smokeshow \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO

      # The watch targets are not embedded in the iOS app, so nothing else
      # would ever compile the complications.
      - name: Build the watch app
        working-directory: apple
        run: |
          xcodebuild build -quiet \
            -project Smokeshow.xcodeproj \
            -scheme SmokeshowWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO
